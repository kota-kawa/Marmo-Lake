services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      MARMO_DATA_DIR: /data
      MARMO_DATABASE_URL: sqlite:////data/marmo.db
      MARMO_ALLOWED_ORIGINS: http://localhost:${MARMO_WEB_PORT:-8080},http://127.0.0.1:${MARMO_WEB_PORT:-8080}
      MARMO_PUBLIC_BASE_URL: http://localhost:${MARMO_WEB_PORT:-8080}
      MARMO_ENVIRONMENT: production
    volumes:
      - marmo-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MARMO_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  marmo-data:
