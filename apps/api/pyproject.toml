[project]
name = "marmo-lake-api"
version = "0.1.0"
description = "FastAPI backend for Marmo Lake V1."
requires-python = ">=3.10"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "cryptography==49.0.0",
  "fastapi==0.138.1",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.49.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.20"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
